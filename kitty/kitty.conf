

# ------------------------------------
# Appearance

## Fonts
font_family      Hack
font_size 10.0

undercurl_style thick-sparse
url_style straight


## Colors
### Foreground/Background
# foreground #dddddd
# background #000000
background_opacity 0.75
background_blur 1

### Cursor
# cursor #cccccc
# cursor_text_color #111111
# cursor_trail_color none

### Text
# inactive_text_alpha 1.0

### Scrollbar
# scrollbar_handle_color foreground
# scrollbar_track_color foreground

### URLs
# url_color #0087bd

### Bell
# visual_bell_color none
# bell_border_color #ff5a00

### Borders
# active_border_color #00ff00
# inactive_border_color #cccccc

### Tabs
# tab_bar_margin_color none
# active_tab_foreground   #000
# active_tab_background   #eee
# inactive_tab_foreground #444
# inactive_tab_background #999
# tab_bar_background none
# tab_bar_margin_color none

### Palette
# color0 #000000
# color8 #767676
# color1 #cc0403
# color9 #f2201f
# color2  #19cb00
# color10 #23fd00
# color3  #cecb00
# color11 #fffd00
# color4  #0d73cc
# color12 #1a8fff
# color5  #cb1ed1
# color13 #fd28ff
# color6  #0dcdcd
# color14 #14ffff
# color7  #dddddd
# color15 #ffffff

# ToDo: transparent_background_colors

## Cursor
cursor_stop_blinking_after 0
cursor_trail 1
cursor_trail_decay 0.03 0.2 
cursor_trail_start_threshold 1


## Scrollbar
scrollbar always
scrollbar_width 0.7
scrollbar_hover_width 1.4
scrollbar_min_handle_height 2.0


## Progressbar
progress_bar top


## Tab bar
tab_bar_edge top
tab_bar_style custom
tab_separator ""
tab_bar_margin_width 6.0
tab_bar_margin_height 4.0 2.0

tab_bar_show_new_tab_button yes
tab_bar_min_tabs 1

active_tab_font_style   bold
inactive_tab_font_style normal

# tab_activity_symbol none
# tab_title_max_length 0
tab_title_template "{f'[{num_windows}] ' if num_windows > 1 else f''}{fmt.fg.red}{bell_symbol}{activity_symbol}{fmt.fg.tab}{title}{tab.last_focused_progress_percent}"
# active_tab_title_template none


## Internal windows
window_padding_width 2.0
single_window_padding_width 2.0
# !TODO: from env variable
window_border_width 0.7pt
window_padding_width 0.2
# draw_minimal_borders yes
# draw_window_borders_for_single_window no
# window_margin_width 0.5
# single_window_margin_width -1
window_padding_width 0.2
# single_window_padding_width -1
# placement_strategy center


# ------------------------------------
# Behaviour

## Clipboard
clipboard_max_size 512
# paste_actions quote-urls-at-prompt,confirm
# clipboard_control write-clipboard write-primary read-clipboard-ask read-primary-ask


## Scrollback
scrollback_lines 20000
scrollback_pager_history_size 10
scrollback_fill_enlarged_window yes

# wheel_scroll_multiplier 5.0
# wheel_scroll_min_lines 1

touch_scroll_multiplier 5.0
# pixel_scroll yes
# momentum_scroll 0.96


## Bell
enable_audio_bell yes
visual_bell_duration 0.45
# bell_on_tab "🔔 "


## Mouse
# mouse_hide_wait 3.0
# click_interval -1.0
# focus_follows_mouse no
select_by_word_characters _
# select_by_word_characters_forward


## URLs
detect_urls yes
allow_hyperlinks yes
show_hyperlink_targets ctrl
underline_hyperlinks always


## Performance
# repaint_delay 10
input_delay 8
sync_to_monitor yes


## Internal windows
# window_resize_step_cells 2
# window_resize_step_lines 2


## OS 
remember_window_size  no
hide_window_decorations yes
# allow_cloning ask
term xterm-kitty
# terminfo_type path
linux_display_server wayland
wayland_enable_ime no

## Misc
# allow_cloning ask
editor nvim
notify_on_cmd_finish unfocused 10 notify-bell
update_check_interval 0

## Menus (ToDo)



# ------------------------------------
# Shortcuts
kitty_mod ctrl+shift

## Windows

# map kitty_mod+space launch
map kitty_mod+enter new_window
map kitty_mod+alt+enter new_window_with_cwd
map kitty_mod+super+enter new_os_window_with_cwd
map kitty_mod+q close_window

map kitty_mod+l neighboring_window right
map kitty_mod+right neighboring_window right
map kitty_mod+h neighboring_window left
map kitty_mod+left neighboring_window left
map kitty_mod+j neighboring_window up
map kitty_mod+up neighboring_window up
map kitty_mod+k neighboring_window down
map kitty_mod+down neighboring_window down

map kitty_mod+alt+tab nth_window -1
map kitty_mod+alt+] next_window
map kitty_mod+alt+[ previous_window

map --new-mode move_window_mode --on-unknown passthrough kitty_mod+m
map --mode move_window_mode h move_window left
map --mode move_window_mode left move_window left
map --mode move_window_mode j move_window down
map --mode move_window_mode down move_window down
map --mode move_window_mode k move_window up
map --mode move_window_mode up move_window up
map --mode move_window_mode l move_window right
map --mode move_window_mode right move_window right
map --mode move_window_mode esc pop_keyboard_mode
map --mode move_window_mode kitty_mod+m pop_keyboard_mode

map kitty_mod+d detach_window
map kitty_mod+/ detach_window ask

map kitty_mod+s swap_with_window

map --new-mode resize_window_mode --on-unknown passthrough kitty_mod+r
map --mode resize_window_mode h resize_window narrower
map --mode resize_window_mode left resize_window narrower
map --mode resize_window_mode l resize_window wider
map --mode resize_window_mode right resize_window wider
map --mode resize_window_mode j resize_window shorter
map --mode resize_window_mode down resize_window shorter
map --mode resize_window_mode k resize_window taller
map --mode resize_window_mode up resize_window taller
map --mode resize_window_mode esc pop_keyboard_mode
map --mode resize_window_mode kitty_mod+r pop_keyboard_mode

map kitty_mod+f11 toggle_fullscreen

## Layouts

## Tabs
map kitty_mod+t new_tab
map kitty_mod+w close_tab

map kitty_mod+] next_tab
map kitty_mod+[ previous_tab
map kitty_mod+tab previous_tab

map kitty_mod+n move_tab_forward
map kitty_mod+b move_tab_backward

map kitty_mod+' detach_tab

# goto_tab omitted: source provides no tab number argument
# select_tab omitted: source provides no key

## Terminal (kitty)

### Copy/paste
map kitty_mod+c copy_or_noop
map kitty_mod+y copy_or_noop
map kitty_mod+alt+c copy_ansi_to_clipboard
map kitty_mod+alt+y copy_ansi_to_clipboard
map kitty_mod+v paste_from_clipboard
map kitty_mod+p paste_from_clipboard
# paste_from_selection

# copy_to_buffer / paste_from_buffer
# <N> interpreted as buffers 1-9
map kitty_mod+alt+1 copy_to_buffer 1
map kitty_mod+1 paste_from_buffer 1
map kitty_mod+alt+2 copy_to_buffer 2
map kitty_mod+2 paste_from_buffer 2
map kitty_mod+alt+3 copy_to_buffer 3
map kitty_mod+3 paste_from_buffer 3
map kitty_mod+alt+4 copy_to_buffer 4
map kitty_mod+4 paste_from_buffer 4
map kitty_mod+alt+5 copy_to_buffer 5
map kitty_mod+5 paste_from_buffer 5
map kitty_mod+alt+6 copy_to_buffer 6
map kitty_mod+6 paste_from_buffer 6
map kitty_mod+alt+7 copy_to_buffer 7
map kitty_mod+7 paste_from_buffer 7
map kitty_mod+alt+8 copy_to_buffer 8
map kitty_mod+8 paste_from_buffer 8
map kitty_mod+alt+9 copy_to_buffer 9
map kitty_mod+9 paste_from_buffer 9
map kitty_mod+alt+0 copy_to_buffer 0
map kitty_mod+0 paste_from_buffer 0

map kitty_mod+equal change_font_size all +1.0
map kitty_mod+minus change_font_size all -1.0

map kitty_mod+; create_marker
map kitty_mod+u remove_marker
map kitty_mod+i scroll_to_mark
map kitty_mod+o toggle_marker

