

# ------------------------------------
# Appearance

## Fonts
font_family      Hack
font_size 10.0

undercurl_style thick-sparse
url_style straight


## Colors
### Foreground/Background
# foreground #dddddd
# background #000000
background_opacity 0.75
background_blur 1

### Cursor
# cursor #cccccc
# cursor_text_color #111111
# cursor_trail_color none

### Text
# inactive_text_alpha 1.0

### Scrollbar
# scrollbar_handle_color foreground
# scrollbar_track_color foreground

### URLs
# url_color #0087bd

### Bell
# visual_bell_color none
# bell_border_color #ff5a00

### Borders
# active_border_color #00ff00
# inactive_border_color #cccccc

### Tabs
# tab_bar_margin_color none
# active_tab_foreground   #000
# active_tab_background   #eee
# inactive_tab_foreground #444
# inactive_tab_background #999
# tab_bar_background none
# tab_bar_margin_color none

### Palette
# color0 #000000
# color8 #767676
# color1 #cc0403
# color9 #f2201f
# color2  #19cb00
# color10 #23fd00
# color3  #cecb00
# color11 #fffd00
# color4  #0d73cc
# color12 #1a8fff
# color5  #cb1ed1
# color13 #fd28ff
# color6  #0dcdcd
# color14 #14ffff
# color7  #dddddd
# color15 #ffffff

# ToDo: transparent_background_colors

## Cursor
cursor_stop_blinking_after 0
cursor_trail 1
cursor_trail_decay 0.03 0.2 
cursor_trail_start_threshold 1


## Scrollbar
scrollbar always
scrollbar_width 0.7
scrollbar_hover_width 1.4
scrollbar_min_handle_height 2.0


## Progressbar
progress_bar top


## Tab bar
tab_bar_edge top
tab_bar_style custom
tab_separator ""
tab_bar_margin_width 6.0
tab_bar_margin_height 4.0 2.0

tab_bar_show_new_tab_button yes
tab_bar_min_tabs 1

active_tab_font_style   bold
inactive_tab_font_style normal

# tab_activity_symbol none
# tab_title_max_length 0
tab_title_template "{f'[{num_windows}] ' if num_windows > 1 else f''}{fmt.fg.red}{bell_symbol}{activity_symbol}{fmt.fg.tab}{title}{tab.last_focused_progress_percent}"
# active_tab_title_template none


## Internal windows
window_padding_width 2.0
single_window_padding_width 2.0
# !TODO: from env variable
window_border_width 0.7pt
window_padding_width 0.2
# draw_minimal_borders yes
# draw_window_borders_for_single_window no
# window_margin_width 0.5
# single_window_margin_width -1
window_padding_width 0.2
# single_window_padding_width -1
# placement_strategy center


# ------------------------------------
# Behaviour

## Clipboard
clipboard_max_size 512
# paste_actions quote-urls-at-prompt,confirm
# clipboard_control write-clipboard write-primary read-clipboard-ask read-primary-ask


## Scrollback
scrollback_lines 20000
scrollback_pager_history_size 10
scrollback_fill_enlarged_window yes

# wheel_scroll_multiplier 5.0
# wheel_scroll_min_lines 1

touch_scroll_multiplier 5.0
# pixel_scroll yes
# momentum_scroll 0.96


## Bell
enable_audio_bell yes
visual_bell_duration 0.45
# bell_on_tab "🔔 "


## Mouse
# mouse_hide_wait 3.0
# click_interval -1.0
# focus_follows_mouse no
select_by_word_characters _
# select_by_word_characters_forward


## URLs
detect_urls yes
allow_hyperlinks yes
show_hyperlink_targets ctrl
underline_hyperlinks always


## Performance
# repaint_delay 10
input_delay 8
sync_to_monitor yes


## Internal windows
# window_resize_step_cells 2
# window_resize_step_lines 2


## OS 
remember_window_size  no
hide_window_decorations yes
# allow_cloning ask
term xterm-kitty
# terminfo_type path
linux_display_server wayland
wayland_enable_ime no

## Misc
# allow_cloning ask
editor nvim
notify_on_cmd_finish unfocused 10 notify-bell
update_check_interval 0

## Menus (ToDo)



# ------------------------------------
# Shortcuts
map ctrl+shift+y neighboring_window right
map ctrl+shift+u move_window right
map ctrl+shift+i nth_window 1
map ctrl+shift+o nth_window 2





